<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#09090b" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Apply saved theme before first paint (prevents a dark/light flash) -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(t);
        }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Harishkanna R | Personal Portfolio</title>
    <meta name="description" content="Harishkanna R - Computer Science Engineering Student. Building scalable web applications, AI-powered systems, and modern digital experiences." />
    <meta name="keywords" content="Harishkanna R, Software Engineer, Portfolio, Computer Science, React, TypeScript, Tailwind CSS, IoT, Machine Learning" />
    <meta name="author" content="Harishkanna R" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Harishkanna R | Developer Portfolio" />
    <meta property="og:description" content="Building scalable web applications, AI-powered systems, and modern digital experiences." />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Harishkanna R portfolio website preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harishkanna R | Developer Portfolio" />
    <meta name="twitter:description" content="Building scalable web applications, AI-powered systems, and modern digital experiences." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
